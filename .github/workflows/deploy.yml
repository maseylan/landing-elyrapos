name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://home.elyrapos.my.id

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://home.elyrapos.my.id
      - name: rsync ke VPS (termasuk .next, tanpa node_modules)
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: -avz --delete --exclude=node_modules --exclude=.git
          remote_path: /srv/POS/Landingpageelyrapos/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
      - name: Install deps & start di VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /srv/POS/Landingpageelyrapos
            npm ci --omit=dev --no-audit --no-fund
            pm2 delete landing-page 2>/dev/null || true
            pm2 start "npm run start -- -p 3001" --name landing-page
            pm2 save
            for i in 1 2 3 4 5; do curl -sf -o /dev/null http://127.0.0.1:3001 && break; sleep 2; done
            curl -sf -o /dev/null http://127.0.0.1:3001 && echo "LANDING_OK"
